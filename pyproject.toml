[tool.poetry]
name = "tg-yd-bot"
version = "0.0.1"
description = "Save from Telegram to Yandex.Disk bot."
authors = ["Andrey <netandreus@gmail.com>"]
readme = "README.md"
# package-mode = false
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = ">=3.13"
aiofiles = "==24.1.0"
aiogram = "==3.13.1"
aiohappyeyeballs = "==2.4.3"
aiohttp = "==3.10.10"
aiosignal = "==1.3.1"
annotated-types = "==0.7.0"
attrs = "==24.2.0"
certifi = "==2024.8.30"
charset-normalizer = "==3.4.0"
frozenlist = "==1.5.0"
idna = "==3.10"
magic-filter = "==1.0.12"
multidict = "==6.1.0"
propcache = "==0.2.0"
pydantic = "==2.9.2"
pydantic-core = "==2.23.4"
python-dotenv = "==1.0.1"
requests = "==2.32.3"
typing-extensions = "==4.12.2"
urllib3 = "==2.2.3"
yadisk = "==3.1.0"
yarl = "==1.16.0"

[tool.poetry.group.dev.dependencies]
setuptools = "^70.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
server = "app.main:start"
